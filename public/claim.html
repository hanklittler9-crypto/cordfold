<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#000000"/>
<title>Available — Cordfol</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/brand.css"/>
<style>
body.brand-body{display:flex;flex-direction:column;min-height:100vh;}
main{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:40px 5vw;}
.panel{max-width:460px;width:100%;text-align:center;}
.handle-pill{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;margin-bottom:26px;}
.handle-pill .prefix{color:var(--ink-faint);font-weight:500;}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,42px);letter-spacing:-0.03em;line-height:1;margin-bottom:14px;text-transform:uppercase;}
p{font-size:14.5px;color:var(--ink-soft);line-height:1.7;margin-bottom:28px;}
.cta{display:inline-block;padding:14px 26px;background:var(--ink);color:#000;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;border-radius:10px;text-decoration:none;}
.cta:hover{opacity:0.88;}
.sub-link{display:block;margin-top:18px;font-size:12.5px;color:var(--ink-faint);text-decoration:none;}
.sub-link:hover{color:var(--ink);}
footer{position:relative;z-index:1;padding:24px 5vw;text-align:center;font-size:11.5px;color:var(--ink-faint);}
</style>
</head>
<body class="brand-body">
<nav class="brand-nav">
  <a class="brand-logo" href="/">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 4h10l6 8-6 8H4l6-8L4 4z" fill="#fff"/>
      <path d="M8 8h4l2.5 4L12 16H8l2.5-4L8 8z" fill="#000"/>
    </svg>
    Cordfol
  </a>
</nav>
<main>
  <div class="panel">
    <div class="handle-pill"><span class="prefix">cordfol.org/</span><span id="handleName">yourname</span></div>
    <h1>This handle is still open.</h1>
    <p>Nobody has claimed it yet. Sign in with Discord, verify your roles, and this link is yours — free, live in under a minute.</p>
    <a class="cta" id="claimBtn" href="https://api.cordfol.org/api/auth/discord">Claim it with Discord</a>
    <a class="sub-link" href="/">or see what Cordfol is first →</a>
  </div>
</main>
<footer>Cordfol — Your Discord Identity, Verified.</footer>
<script>
const CLAIM_COOKIE_NAME = 'cordfol_claim_slug';
const slug = decodeURIComponent(location.pathname.replace(/^\//, '')).toLowerCase().replace(/[^a-z0-9\-]/g, '').slice(0, 32);
if (slug) {
  document.getElementById('handleName').textContent = slug;
  document.title = `cordfol.org/${slug} is available — Cordfol`;
  document.getElementById('claimBtn').addEventListener('click', () => {
    document.cookie = `${CLAIM_COOKIE_NAME}=${encodeURIComponent(slug)}; Max-Age=1800; Path=/; Domain=.cordfol.org; Secure; SameSite=Lax`;
  });
}
</script>
</body>
</html>
