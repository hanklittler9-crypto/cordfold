<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Compare — Cordfol</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/brand.css"/>
<style>
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:100px 5vw 80px;}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:0.14em;color:var(--ink-faint);margin-bottom:14px;text-transform:uppercase;}
.title{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,5vw,56px);line-height:0.98;letter-spacing:-0.03em;margin-bottom:14px;text-transform:uppercase;}
.sub{font-size:15px;color:var(--ink-soft);max-width:520px;line-height:1.65;margin-bottom:28px;}
.pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px;}
.pick input{flex:1;min-width:180px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:13px 14px;font:600 14px var(--font-body);}
.pick button{border:none;border-radius:12px;background:#fff;color:#050505;font-weight:700;padding:13px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;font-size:12px;}
.pick button#surprise{background:transparent;color:var(--ink);border:1px solid var(--line);}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:start;}
.col{background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:220px;}
.mid{align-self:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--ink-faint);}
.av{width:64px;height:64px;border-radius:18px;object-fit:cover;background:#111;margin-bottom:12px;}
.name{font-family:var(--font-display);font-weight:800;font-size:20px;text-transform:uppercase;}
.handle{font-size:12px;color:var(--ink-faint);margin:4px 0 14px;}
.handle a{color:inherit;}
.stat{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft);}
.stat b{color:var(--ink);}
.err{color:#ff8aa0;font-size:13px;}
@media (max-width:720px){.vs{grid-template-columns:1fr;}.mid{text-align:center;}}
</style>
</head>
<body class="brand-body">
<nav class="brand-nav">
  <a class="brand-logo" href="/"><img class="brand-mark" src="/logo.svg" alt="" width="22" height="22"/>Cordfol</a>
  <a class="brand-signin" href="/servers">Servers</a>
</nav>
<div class="wrap">
  <div class="eyebrow">Verified vs verified</div>
  <h1 class="title">Compare two profiles.</h1>
  <p class="sub">Roles, views, and vibe side by side. Guns can’t prove any of this.</p>
  <form class="pick" id="form">
    <input id="a" name="a" placeholder="cordfol.org/one" autocomplete="off"/>
    <input id="b" name="b" placeholder="cordfol.org/two" autocomplete="off"/>
    <button type="submit">Compare</button>
    <button type="button" id="surprise">Surprise both</button>
  </form>
  <div class="vs" id="vs"></div>
</div>
<script>
const API = 'https://api.cordfol.org/api';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));}
function parseSlug(raw){
  return String(raw||'').trim().replace(/^https?:\/\//i,'').replace(/^(www\.)?cordfol\.org\//i,'').replace(/^\/+/,'').split(/[/?#]/)[0].toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,32);
}
function fmt(n){n=Number(n)||0;if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(n);}
async function loadOne(slug){
  const res=await fetch(`${API}/profile/${encodeURIComponent(slug)}`);
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'Not found');
  return data;
}
function card(data){
  const p=data.profile||{};
  const roles=data.roles||[];
  const t=data.theme||{};
  return `<div class="col" style="border-color:${esc(t.accentColor||'#333')}">
    <img class="av" src="${esc(p.avatarUrl||'https://cdn.discordapp.com/embed/avatars/0.png')}" alt="" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'"/>
    <div class="name">${esc(p.displayName||p.slug)}</div>
    <div class="handle"><a href="/${esc(p.slug)}">cordfol.org/${esc(p.slug)}</a></div>
    <div class="stat"><span>Views</span><b>${fmt(p.viewCount)}</b></div>
    <div class="stat"><span>Roles</span><b>${roles.length}</b></div>
    <div class="stat"><span>Bot verified</span><b>${roles.filter(r=>r.proofType==='BOT').length}</b></div>
    <div class="stat"><span>Spotify</span><b>${p.spotify?.public?'On':'Off'}</b></div>
    <div class="stat"><span>Name effect</span><b>${esc(t.nameEffect||'none')}</b></div>
    <div class="stat"><span>Top role</span><b>${esc(roles[0]?.roleName||'—')}</b></div>
  </div>`;
}
async function run(a,b){
  const box=document.getElementById('vs');
  if(!a||!b){box.innerHTML='<div class="err">Need two handles.</div>';return;}
  box.innerHTML='<div class="err">Loading…</div>';
  try{
    const [left,right]=await Promise.all([loadOne(a),loadOne(b)]);
    box.innerHTML=card(left)+'<div class="mid">VS</div>'+card(right);
    history.replaceState({},'',`/compare?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
  }catch(err){
    box.innerHTML=`<div class="err">${esc(err.message||'Could not compare.')}</div>`;
  }
}
const params=new URLSearchParams(location.search);
document.getElementById('a').value=params.get('a')||'';
document.getElementById('b').value=params.get('b')||'';
document.getElementById('form').onsubmit=(e)=>{
  e.preventDefault();
  run(parseSlug(document.getElementById('a').value),parseSlug(document.getElementById('b').value));
};
if(params.get('a')&&params.get('b')) run(parseSlug(params.get('a')),parseSlug(params.get('b')));
document.getElementById('surprise').onclick=async()=>{
  try{
    const res=await fetch(`${API}/random?n=2`);
    const data=await res.json();
    const slugs=data.slugs||[];
    if(slugs.length<2) throw new Error('Need at least two profiles.');
    document.getElementById('a').value=slugs[0];
    document.getElementById('b').value=slugs[1];
    run(slugs[0],slugs[1]);
  }catch(err){
    document.getElementById('vs').innerHTML=`<div class="err">${esc(err.message||'Could not surprise.')}</div>`;
  }
};
</script>
</body>
</html>
